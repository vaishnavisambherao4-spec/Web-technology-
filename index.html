<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="login-box">
      <h2>Login 🔐</h2>
      <p class="subtitle">Tujha account madhe login kar</p>

      <form id="loginForm">
        <label>Username</label>
        <input type="text" id="username" placeholder="Username tak" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Password tak" required>

        <button type="submit">Login</button>
        <p id="msg"></p>
      </form>

      <p class="bottom">Account nahi ka? <a href="#">Sign Up</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
